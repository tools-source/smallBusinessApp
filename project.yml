name: SmallBusinessApp
options:
  bundleIdPrefix: com.majdinagi
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  SmallBusinessApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SmallBusinessApp/Sources
      - path: SmallBusinessApp/Resources
        buildPhase: resources
    entitlements:
      path: SmallBusinessApp/SmallBusinessApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SmallBusinessApp/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HQDDMSV8AR
        PRODUCT_BUNDLE_IDENTIFIER: com.majdinagi.SmallBusinessApp
        GOOGLE_CLIENT_ID: 1234567890-placeholder.apps.googleusercontent.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1234567890-placeholder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    scheme:
      testTargets: []
